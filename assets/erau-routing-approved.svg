<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 941" role="img" aria-labelledby="erau-title erau-desc">
<title id="erau-title">ERAU signal-routing schematic based on Jens's annotated drawing</title>
<desc id="erau-desc">Illustration showing Group X0 and Group X1 on the module side, Group Y0 and Group Y1 on the peripheral side, direct routes in orange, cross-routes in green, loops in yellow, fan-out in blue, and logic operation as dashed orange lines through an AND gate inside the ERAU fabric.</desc>
<defs>
<pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" stroke="#16405a" stroke-width="0.8" fill="none" opacity=".58"/></pattern>
<marker id="arr-left" markerWidth="7" markerHeight="7" refX="2" refY="3.5" orient="auto"><path d="M7 0L0 3.5L7 7Z" fill="#2ddd66"/></marker>
</defs>
