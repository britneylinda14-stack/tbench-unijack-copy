name: Verify sketch-accurate ERAU routing
on:
  push:
    branches: [feature/erau-sketch-faithful-layout]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Validate routing code and structure
        run: |
          node --check app.js
          python3 - <<'PY'
          from pathlib import Path
          h=Path('index.html').read_text()
          assert 'erau-sketch-map' in h
          assert 'GROUP 10' in h and 'GROUP 11' in h
          assert 'erau-inline-gate-label' in h
          assert all('erau-'+mode in h for mode in ['direct','cross','loop','fanout','logic'])
          assert 'shared-nav.js' in h
          print('PASS original site, navigation and all five routes')
          PY
      - name: Install browser
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install chromium
      - name: Check rendering and all interactive routing modes
        run: |
          set -e
          python3 -m http.server 4173 >/tmp/erau-verification.log 2>&1 &
          cat > test-erau.cjs <<'JS'
          const {chromium}=require('playwright'), assert=require('node:assert/strict');
          (async()=>{
           const browser=await chromium.launch({args:['--no-sandbox','--disable-dev-shm-usage']});
           try{
            for(const width of [390,768,1440]){
             const page=await browser.newPage({viewport:{width,height:920},reducedMotion:'reduce'});
             const errors=[];page.on('pageerror',e=>errors.push(e.message));
             await page.route('**/vendor/**',r=>r.abort());
             await page.goto('http://127.0.0.1:4173/',{waitUntil:'domcontentloaded'});
             await page.waitForFunction(()=>document.documentElement.dataset.signalReady==='yes',{timeout:20000});
             assert.equal(await page.locator('.erau-channel-labels text').count(),24);
             assert.equal(await page.locator('.erau-connectors rect').count(),16);
             assert.equal(await page.locator('.erau-legend span').count(),5);
             const modes={route:'.erau-direct',cross:'.erau-cross',loopback:'.erau-loop',fanout:'.erau-fanout',logic:'.erau-logic'};
             for(const [name,selector] of Object.entries(modes)){
               await page.locator('[data-route="'+name+'"]').click();
               assert.equal(await page.locator('.erau-sketch-layout').getAttribute('data-signal-mode'),name);
               const alpha=await page.locator(selector).evaluate(e=>getComputedStyle(e).opacity);
               assert.equal(alpha,'1','Active route not highlighted '+name+' opacity '+alpha);
             }
             for(const gate of ['AND','NAND','OR','NOR','XOR','NOT']){
               await page.locator('#logic-gate').selectOption(gate);
               assert.equal(await page.locator('.erau-sketch-layout').getAttribute('data-logic-gate'),gate);
               const second=await page.locator('.logic-input-b').evaluate(el=>getComputedStyle(el).display);
               assert.equal(second==='none',gate==='NOT','Incorrect second input gate '+gate);
               assert.equal((await page.locator('.erau-inline-gate-label').innerText()).startsWith(gate),true);
             }
             await page.locator('[data-route="route"]').click();
             const overflow=await page.evaluate(()=>document.documentElement.scrollWidth-innerWidth);
             assert.ok(overflow<=2,'Horizontal overflow '+width+': '+overflow);
             assert.deepEqual(errors,[]);
             await page.locator('#routing').scrollIntoViewIfNeeded();
             await page.screenshot({path:'erau-sketch-'+width+'.png',fullPage:false,animations:'disabled'});
             console.log('PASS sketch',width,'overflow',overflow);
             await page.close();
            }
           }finally{await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node test-erau.cjs
      - name: Save screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: erau-sketch-fidelity
          path: erau-sketch-*.png
          if-no-files-found: ignore
