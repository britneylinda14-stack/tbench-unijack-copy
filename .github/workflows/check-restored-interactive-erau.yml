name: Verify approved interactive ERAU
on:
  push:
    branches: [fix/interactive-erau-with-approved-diagram]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Check source
        run: |
          node --check app.js
          python3 - <<'PY'
          from pathlib import Path
          h=Path('index.html').read_text()
          assert h.count('class="approved-routing-graphic"')==1
          assert 'erau-routing-approved.svg' not in h
          assert all('data-route="'+m+'"' in h for m in ['route','cross','fanout','loopback','logic'])
          assert all('path-'+m in h for m in ['route','cross','fanout','loopback','logic'])
          assert 'logic-gate-symbol' in h
          assert 'shared-nav.js' in h
          print('PASS structure')
          PY
      - name: Browser setup
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install chromium
      - name: Verify restored interactivity and compact layout
        run: |
          set -e
          python3 -m http.server 4173 >/tmp/server.log 2>&1 &
          cat > test.cjs <<'JS'
          const {chromium}=require('playwright'),assert=require('node:assert/strict');
          (async()=>{
            const browser=await chromium.launch({args:['--no-sandbox','--disable-dev-shm-usage']});
            try{
              for(const width of [390,768,1440]){
                const page=await browser.newPage({viewport:{width,height:900},reducedMotion:'reduce'});
                const errors=[];page.on('pageerror',e=>errors.push(e.message));
                await page.route('**/vendor/**',r=>r.abort());
                const response=await page.goto('http://127.0.0.1:4173/',{waitUntil:'domcontentloaded'});
                assert.equal(response.status(),200);
                await page.waitForFunction(()=>document.documentElement.dataset.signalReady==='yes');
                assert.equal(await page.locator('.routing-switch button').count(),5);
                assert.equal(await page.locator('.approved-path').count(),15);
                for(const [mode,c] of Object.entries({route:'route',cross:'cross',loopback:'loopback',fanout:'fanout',logic:'logic'})){
                  await page.locator('[data-route="'+mode+'"]').click();
                  assert.equal(await page.locator('.signal-diagram').getAttribute('data-signal-mode'),mode);
                  const opacity=await page.locator('.path-'+c).first().evaluate(x=>getComputedStyle(x).opacity);
                  assert.equal(opacity,'1','active path opacity '+mode+': '+opacity);
                }
                for(const gate of ['AND','NAND','OR','NOR','XOR','NOT']){
                  await page.locator('#logic-gate').selectOption(gate);
                  assert.equal(await page.locator('.signal-diagram').getAttribute('data-logic-gate'),gate);
                  assert.equal(await page.locator('#erau-gate-caption').textContent(),gate);
                }
                assert.deepEqual(errors,[]);
                const overflow=await page.evaluate(()=>document.documentElement.scrollWidth-window.innerWidth);
                assert.ok(overflow<=2,'page overflow '+width+': '+overflow);
                const layout=await page.locator('#routing').evaluate(el=>({grid:getComputedStyle(el).gridTemplateColumns,panel:el.querySelector('.routing-panel').getBoundingClientRect().width}));
                if(width===1440)assert.ok(layout.panel<750,'panel unexpectedly enlarged');
                await page.locator('[data-route="route"]').click();
                await page.locator('#routing').scrollIntoViewIfNeeded();
                await page.screenshot({path:'interactive-'+width+'.png',fullPage:false,animations:'disabled'});
                console.log('PASS',width,JSON.stringify(layout));
                await page.close();
              }
            }finally{await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node test.cjs
      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: approved-interactive-eraus
          path: interactive-*.png
          if-no-files-found: ignore
