name: Inspect live ERAU website
on:
  push:
    branches: [fix/erau-visible-public]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Compare published website with repo
        run: |
          set -e
          python3 - <<'PY'
          import requests, re, hashlib
          base="https://britneylinda14-stack.github.io/tbench-unijack-copy/"
          for suffix in ["","?check=20261030-erau","app.js","style.css"]:
            u=base+suffix
            r=requests.get(u,timeout=30,headers={"Cache-Control":"no-cache","Pragma":"no-cache"})
            print("URL",u,"HTTP",r.status_code,"FINAL",r.url,"SIZE",len(r.content),"CACHE",r.headers.get("cache-control"),"AGE",r.headers.get("age"),"ETAG",r.headers.get("etag"),"SERVER",r.headers.get("server"))
            print("ERU_NEW", 'erau-map' in r.text,"ERU_OLD", 'class="signal-diagram"' in r.text,"FLOW", 'erau-cross' in r.text, "SHA256",hashlib.sha256(r.content).hexdigest()[:20])
            if suffix=="":open("actual-live.html","w").write(r.text)
            if suffix=="" or suffix.startswith("?"):
              assert r.status_code==200
              assert 'erau-map' in r.text, 'Live ERAU markup not updated'
          PY
      - name: Capture live screenshot
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install chromium
          cat > check-live.cjs <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({args:['--no-sandbox','--disable-dev-shm-usage']});
            try{
              for(const w of [390,1440]){
                const page=await browser.newPage({viewport:{width:w,height:900},reducedMotion:'reduce'});
                const errs=[];page.on('pageerror',e=>errs.push(e.message));
                const resp=await page.goto('https://britneylinda14-stack.github.io/tbench-unijack-copy/?erau-check=20261030#routing',{waitUntil:'domcontentloaded',timeout:40000});
                console.log('LIVE',w,resp?.status(),page.url(),'new map count',await page.locator('.erau-map').count(),'old map',await page.locator('.signal-lines:not(.erau-map)').count(),'JS errors',errs);
                await page.locator('#routing').scrollIntoViewIfNeeded();
                await page.screenshot({path:'live-eraunew-'+w+'.png',fullPage:false,animations:'disabled'});
                await page.close();
              }
            }finally{await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node check-live.cjs
      - name: Save live inspection screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-erau-inspection
          path: |
            actual-live.html
            live-eraunew-*.png
          if-no-files-found: ignore
