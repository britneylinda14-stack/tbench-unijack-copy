name: Mirror UniJack Studio public website
on:
  push:
    branches: [netlify-mirror-setup]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download website and recursive JavaScript dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/unijack-studio-site
          cat > /tmp/mirror.py <<'PY'
          import os, re, ssl, urllib.request, urllib.parse, posixpath, collections, json, html
          base = 'https://unijack-studio.netlify.app/'
          dest = '/tmp/unijack-studio-site'
          todo=collections.deque(['index.html','style.css','app.js','motion.js','product-scene.js','vendor/three.module.js'])
          seen=set()
          fetched=[]
          failed={}
          exts=('.js','.mjs','.css','.webp','.jpg','.jpeg','.png','.svg','.json','.glb','.wasm','.woff','.woff2','.gif','.mp4')
          def reference(ref, current):
              ref=html.unescape(ref.strip())
              if not ref or ref.startswith(('data:','#','mailto:','tel:','blob:')): return
              if ref == 'three': ref='vendor/three.module.js'
              elif ref.startswith('three/addons/'):ref='vendor/'+ref.removeprefix('three/addons/')
              elif ref.startswith(('http://','https://')):
                  parsed=urllib.parse.urlparse(ref)
                  if parsed.netloc!='unijack-studio.netlify.app':return
                  ref=parsed.path.lstrip('/')
              elif ref.startswith('/'):ref=ref.lstrip('/')
              else:ref=posixpath.normpath(posixpath.join(posixpath.dirname(current),ref))
              ref=urllib.parse.urlparse(ref).path
              if ref.startswith('../') or not ref or not ref.lower().endswith(exts): return
              if ref not in seen:todo.append(ref)
          while todo and len(seen)<400:
              path=todo.popleft()
              if path in seen:continue
              seen.add(path)
              try:
                  req=urllib.request.Request(urllib.parse.urljoin(base,urllib.parse.quote(path)),headers={'User-Agent':'Mozilla/5.0 UniJackMirror/1.0'})
                  with urllib.request.urlopen(req,timeout=25) as response:
                      data=response.read(25000000)
                      ctype=response.headers.get('Content-Type','')
                      if response.status!=200:raise ValueError('HTTP '+str(response.status))
                      if path.endswith('.js') and b'<html' in data[:100].lower():raise ValueError('HTML served instead of JS')
                  target=os.path.join(dest,path)
                  os.makedirs(os.path.dirname(target),exist_ok=True)
                  with open(target,'wb') as f:f.write(data)
                  fetched.append({'path':path,'bytes':len(data)})
                  if path.endswith(('.js','.mjs','.html','.css')):
                      source=data.decode('utf-8','replace')
                      for ref in re.findall(r'''["']([^"'\n\r<> ]+)["']''',source):
                          if ref.lower().split('?')[0].endswith(exts):reference(ref,path)
                      for ref in re.findall(r'''(?:from\s*|import\s*\(|url\s*\()\s*["']?([^\s"')]+)''',source):
                          reference(ref,path)
                      if path.endswith('index.html'):
                          for ref in re.findall(r'''(?:src|href)=["']([^"']+)''',source):
                              reference(ref,path)
                  print('OK',path,len(data),flush=True)
              except Exception as e:
                  failed[path]=str(e)
                  print('FAILED',path,str(e),flush=True)
          critical=['index.html','style.css','app.js','motion.js','product-scene.js']
          if any(p in failed for p in critical):
              raise RuntimeError('Critical files missing: '+str({p:failed.get(p) for p in critical if p in failed}))
          with open(os.path.join(dest,'MIRROR_REPORT.json'),'w') as f:
              json.dump({'source':base,'fetched':fetched,'missing':failed,'note':'Static mirror only; Netlify functions and runtime API calls are not copied.'},f,indent=2)
          print('TOTAL',len(fetched),'missing',len(failed))
          PY
          python /tmp/mirror.py
      - name: Commit the static website to the isolated mirror branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch --orphan netlify-site-mirror
          git rm -r -f . || true
          cp -a /tmp/unijack-studio-site/. .
          cat > MIRROR_SOURCE.md <<'EOF'
          # UniJack Studio static website mirror

          Original public site: https://unijack-studio.netlify.app/

          This is a capture of the publicly served HTML, styles, scripts and
          assets. It is not the original authoring repository. Dynamic server-side
          functions and external APIs are not guaranteed to be included.
          See MIRROR_REPORT.json for downloaded files and missing dependencies.
          EOF
          git add -A
          git commit -m "Capture public UniJack Studio site and JavaScript dependencies"
          git push --force origin HEAD:refs/heads/netlify-site-mirror
