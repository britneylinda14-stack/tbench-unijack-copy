name: Verify approved TBench logo only
on:
  push:
    branches: [logo/official-tbench-logo-2026-10-30]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Check approved logo references
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          logo=Path('assets/tbench-official-logo.svg')
          assert logo.exists()
          root=ET.parse(logo).getroot()
          assert root.attrib['viewBox']=='0 0 820 318'
          htmls=['index.html','tbench/index.html','tbench/academia/index.html','tbench/enterprise/index.html','tbench/builders/index.html','tbench/products/venus-mxo4/index.html','tbench/products/venus-mxo5/index.html']
          for path in htmls:
            html=Path(path).read_text()
            assert html.count('class="brand-logo"')==2,path
            assert 'TBench Solutions' in html,path
            assert '<span class="mark" aria-hidden="true">t' not in html,path
            assert '<span class="brand-symbol" aria-hidden="true">t' not in html,path
          print('PASS: approved logo on all seven pages in both header and footer')
          PY
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install chromium
      - name: Check appearance, image loading and layout
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 >/tmp/logo-server.log 2>&1 &
          cat >/tmp/check-logo.cjs <<'JS'
          const {chromium}=require(process.cwd()+'/node_modules/playwright'), assert=require('node:assert/strict');
          (async()=>{
            const browser=await chromium.launch({args:['--no-sandbox','--disable-dev-shm-usage']});
            try{
              for(const [path,name] of [['/','unijack'],['/tbench/','tbench'],['/tbench/academia/','academia'],['/tbench/enterprise/','enterprise'],['/tbench/builders/','builders'],['/tbench/products/venus-mxo4/','venus4'],['/tbench/products/venus-mxo5/','venus5']]){
                for(const width of [375,1024,1440]){
                  const page=await browser.newPage({viewport:{width,height:900},reducedMotion:'reduce'});
                  const errors=[];page.on('pageerror',e=>errors.push(e.message));
                  await page.route('**/vendor/**',route=>route.abort());
                  const response=await page.goto('http://127.0.0.1:4173'+path,{waitUntil:'domcontentloaded'});
                  assert.equal(response.status(),200,path);
                  const logos=page.locator('.brand-logo');
                  assert.equal(await logos.count(),2,path);
                  for(const logo of await logos.all()){
                    const x=await logo.evaluate(img=>({complete:img.complete,valid:img.naturalWidth===820&&img.naturalHeight===318,width:img.getBoundingClientRect().width}));
                    assert.ok(x.complete&&x.valid&&x.width>=100&&x.width<=160,JSON.stringify({path,width,x}));
                  }
                  const overflow=await page.evaluate(()=>document.documentElement.scrollWidth-window.innerWidth);
                  assert.ok(overflow<=2,name+' overflow '+width+': '+overflow);
                  assert.deepEqual(errors,[]);
                  if((name==='unijack'||name==='tbench')&&(width===375||width===1440)){
                    await page.screenshot({path:'brand-'+name+'-'+width+'.png',fullPage:false,animations:'disabled'});
                  }
                  console.log('PASS',name,width,'overflow',overflow);
                  await page.close();
                }
              }
            }finally{await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node /tmp/check-logo.cjs
      - name: Save header screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-logo-header-review
          path: brand-*.png
          if-no-files-found: ignore
