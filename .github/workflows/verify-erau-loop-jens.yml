name: Verify Jens ERAU loop correction
on:
  push:
    branches: [fix/erau-loop-jens-nov9]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Check routing structure and JS
        run: |
          node --check app.js
          python3 - <<'PY'
          import re
          from pathlib import Path
          s=Path("index.html").read_text()
          loops=re.findall(r'<path d="([^"]+)" class="trace approved-path path-loopback"',s)
          assert len(loops)==1, loops
          assert loops[0].startswith("M270 429 H780 C")
          assert loops[0].endswith("H270")
          assert "erau-loop-9" in s
          assert "data-route=\"loopback\"" in s
          assert len(re.findall('class="trace approved-path path-fanout"',s))==5
          assert len(re.findall('class="trace approved-path path-cross"',s))==2
          print("PASS unchanged Fan-Out and Cross; curved U-turn Loop")
          PY
      - name: Browser setup
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install chromium
      - name: Verify interactive Loop and responsive layout
        run: |
          set -e
          python3 -m http.server 4173 >/tmp/erau-server.log 2>&1 &
          cat > check.cjs <<'JS'
          const {chromium}=require('playwright'),assert=require('node:assert/strict');
          (async()=>{
            const browser=await chromium.launch({args:['--no-sandbox','--disable-dev-shm-usage']});
            try{
              for(const width of [390,768,1440]){
                const page=await browser.newPage({viewport:{width,height:900},reducedMotion:'reduce'});
                const errors=[];page.on('pageerror',e=>errors.push(e.message));
                await page.route('**/vendor/**',r=>r.abort());
                const response=await page.goto('http://127.0.0.1:4173/',{waitUntil:'domcontentloaded'});
                assert.equal(response.status(),200);
                await page.waitForFunction(()=>document.documentElement.dataset.signalReady==='yes');
                await page.locator('[data-route="loopback"]').click();
                assert.equal(await page.locator('.signal-diagram').getAttribute('data-signal-mode'),'loopback');
                const path=page.locator('.approved-path.path-loopback');
                assert.equal(await path.count(),1);
                assert.equal(await path.evaluate(el=>getComputedStyle(el).opacity),'1');
                assert.match(await page.locator('#routing-description').textContent(),/curves around and returns/);
                for(const other of ['route','cross','fanout','logic']){
                  await page.locator('[data-route="'+other+'"]').click();
                  assert.equal(await page.locator('.signal-diagram').getAttribute('data-signal-mode'),other);
                }
                const overflow=await page.evaluate(()=>document.documentElement.scrollWidth-window.innerWidth);
                assert.ok(overflow<=2,'overflow '+width+': '+overflow);
                assert.deepEqual(errors,[]);
                await page.locator('[data-route="loopback"]').click();
                await page.locator('#routing').scrollIntoViewIfNeeded();
                await page.screenshot({path:'erau-loop-'+width+'.png',animations:'disabled'});
                console.log('PASS ERAU loop',width);
                await page.close();
              }
            }finally{await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node check.cjs
      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: erau-loop-review
          path: erau-loop-*.png
          if-no-files-found: ignore
